<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 - 聚宝赞开放平台</title>
  <script src="/admin/vendor/vue.global.prod.js"></script>
  <script src="/admin/vendor/vue-router.global.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #1f2937; }
    #app { min-height: 100vh; }
    a { color: #3b82f6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    #error-box { display:none; padding:20px; margin:20px; border:2px solid #ef4444; border-radius:8px; background:#fef2f2; color:#991b1b; white-space:pre-wrap; font-family:monospace; }
  </style>
</head>
<body>
  <div id="app">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#9ca3af;">
      加载中...
    </div>
  </div>
  <div id="error-box"></div>
  <script>
  // 全局错误捕获
  window.onerror = function(msg, url, line) {
    var el = document.getElementById('error-box')
    el.style.display = 'block'
    el.innerHTML = 'JS Error: ' + msg + '\nFile: ' + url + '\nLine: ' + line
  }
  </script>
  <script src="/admin/app-bundle.js"></script>
</body>
</html>
